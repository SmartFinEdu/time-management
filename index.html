<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планування — фундамент успіху в бізнесі</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .animate-confetti {
      animation: confetti-fall linear forwards;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #certificate-print-area, #certificate-print-area * {
        visibility: visible;
      }
      #certificate-print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        box-shadow: none !important;
        border-width: 4px !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-indigo-200">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* 8 True/False questions (8 points total) */
    const trueFalseQuestions = [
      { 
        text: "Тайм-менеджмент та планування потрібні виключно керівникам великих компаній.", 
        answer: false, 
        explanation: "Планування часових та особистих ресурсів необхідне кожній людині, зокрема учням для досягнення цілей у навчанні та стартапах." 
      },
      { 
        text: "Принцип Парето 80/20 стверджує, що 20% зусиль дають 80% підсумкового результату.", 
        answer: true, 
        explanation: "Головне — знайти ті 20% найрезультативніших справ і не витрачати ресурси на другорядні рутинні задачі." 
      },
      { 
        text: "Метод Pomodoro передбачає 25 хвилин зосередженої роботи без відволікань та 3-5 хвилин перерви.", 
        answer: true, 
        explanation: "Короткі робочі інтервали допомагають зберігати фокус і запобігають швидкій втомі мозоку." 
      },
      { 
        text: "У матриці Ейзенхауера важливі та термінові справи варто відкладати на вечір або делегувати.", 
        answer: false, 
        explanation: "Термінові та важливі справи (Квадрант А — «кризи») потрібно виконувати негайно та першочергово." 
      },
      { 
        text: "Органайзер призначений для планування майбутніх дій, а тайм-трекер — для фіксації та аналізу фактичних витрат часу.", 
        answer: true, 
        explanation: "Органайзер будує маршрут, а тайм-трекер аналізує, куди реально витікає час і хто є «пожирачем часу»." 
      },
      { 
        text: "Метод «З'їсти жабу зранку» означає виконання найпростіших та найприємніших справ на початку дня.", 
        answer: false, 
        explanation: "«Жаба» — це найскладніша або найменш приємна справа дня, яку варто зробити найпершою, щоб зняти стрес." 
      },
      { 
        text: "Делегування завдань команді дозволяє підприємцю вивільнити час для стратегічного планування.", 
        answer: true, 
        explanation: "Розподіл обов’язків захищає від перевантаження та підвищує загальну ефективність проєкту." 
      },
      { 
        text: "Відпочинок та паузи в роботі є марнуванням часу і не повинні вноситися до планерів.", 
        answer: false, 
        explanation: "Якісний відпочинок — це важливий ресурс, який необхідно планувати для запобігання вигоранню." 
      }
    ];

    /* 4 Match questions (4 points total) -> Total Max Score = 12 points */
    const matchQuestions = [
      { id: 'q1', text: 'Поділ справ на 4 квадранти за терміновістю та важливістю', matchId: 'a1' },
      { id: 'q2', text: 'Правило фокусування на 20% найефективніших дій', matchId: 'a2' },
      { id: 'q3', text: 'Техніка інтервальної роботи (25 хв роботи / 5 хв відпочинку)', matchId: 'a3' },
      { id: 'q4', text: 'Інструмент для фіксації та виявлення «пожирачів часу»', matchId: 'a4' },
    ];

    const matchAnswers = [
      { id: 'a4', text: 'Тайм-трекер' },
      { id: 'a1', text: 'Матриця Ейзенхауера' },
      { id: 'a3', text: 'Метод Pomodoro' },
      { id: 'a2', text: 'Принцип Парето' },
    ];

    /* Audio Generator using Web Audio API */
    const playAudioCue = (type, soundEnabled = true) => {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'correct') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.25);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(146.83, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'victory') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gain.gain.setValueAtTime(0.25, now + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 0.35);
          });
        }
      } catch (e) {
        console.warn("Audio Context error", e);
      }
    };

    const ConfettiEffect = () => (
      <div className="fixed inset-0 pointer-events-none overflow-hidden z-50">
        {[...Array(80)].map((_, i) => {
          const colors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'];
          const randomColor = colors[i % colors.length];
          const randomLeft = Math.random() * 100;
          const randomDelay = Math.random() * 0.6;
          const randomDuration = 1.8 + Math.random() * 1.5;
          const size = 8 + Math.random() * 8;
          
          return (
            <div 
              key={i}
              className="absolute rounded-sm animate-confetti"
              style={{
                backgroundColor: randomColor,
                left: `${randomLeft}%`,
                top: `-20px`,
                width: `${size}px`,
                height: `${size * 1.2}px`,
                animationDelay: `${randomDelay}s`,
                animationDuration: `${randomDuration}s`
              }}
            />
          );
        })}
      </div>
    );

    const TitleBadge = ({ text, color = "bg-indigo-600", textColor = "text-white", subtitle }) => (
      <div className="flex flex-col items-center mb-4 md:mb-6 text-center">
        <div className={`${color} ${textColor} text-2xl md:text-4xl lg:text-5xl font-black py-4 px-8 md:px-10 rounded-3xl shadow-xl border-4 border-white transform -rotate-1 transition-transform hover:rotate-0 duration-300`}>
          {text}
        </div>
        {subtitle && (
          <p className="mt-4 text-slate-700 font-bold text-lg md:text-2xl max-w-3xl leading-snug">
            {subtitle}
          </p>
        )}
      </div>
    );

    function App() {
      const totalSlides = 11;
      const maxScore = 12;

      const [currentSlide, setCurrentSlide] = useState(0);
      const [userName, setUserName] = useState('');
      const [score, setScore] = useState(0);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showConfetti, setShowConfetti] = useState(false);

      // Mini-game states
      const [tfAnswers, setTfAnswers] = useState({});
      const [selectedMatchQ, setSelectedMatchQ] = useState(null);
      const [matchedPairs, setMatchedPairs] = useState({});

      // Eisenhower Interactive Drag/Click Simulator
      const [eisenhowerTasks, setEisenhowerTasks] = useState([
        { id: 't1', title: 'Підготовка підсумкової презентації проєкту (дедлайн завтра)', quad: null, correctQuad: 'A' },
        { id: 't2', title: 'Систематичне вивчення англійської для розширення бізнесу', quad: null, correctQuad: 'B' },
        { id: 't3', title: 'Відповіді на сповіщення в загальному чаті під час роботи', quad: null, correctQuad: 'C' },
        { id: 't4', title: 'Нескінченна прокрутка стрічки соцмереж від нудьги', quad: null, correctQuad: 'D' },
      ]);

      // Tracker simulator state
      const [trackerTasks, setTrackerTasks] = useState([
        { time: '09:00 - 10:30', activity: 'Розробка планера проєкту', type: 'useful' },
        { time: '10:30 - 11:30', activity: 'Перегляд відео з трендами в ТікТок', type: 'waster' },
        { time: '11:30 - 12:30', activity: 'Прибирання та впорядкування столу', type: 'routine' },
      ]);

      const nextSlide = () => {
        if (currentSlide < totalSlides) {
          playAudioCue('click', soundEnabled);
          setCurrentSlide(prev => prev + 1);
          setShowConfetti(false);
        }
      };

      const prevSlide = () => {
        if (currentSlide > 0) {
          playAudioCue('click', soundEnabled);
          setCurrentSlide(prev => prev - 1);
          setShowConfetti(false);
        }
      };

      const handleTfAnswer = (index, userChoice) => {
        if (tfAnswers[index] !== undefined) return;
        const isCorrect = userChoice === trueFalseQuestions[index].answer;
        
        setTfAnswers(prev => ({ ...prev, [index]: userChoice }));
        if (isCorrect) {
          setScore(prev => prev + 1);
          playAudioCue('correct', soundEnabled);
        } else {
          playAudioCue('wrong', soundEnabled);
        }
      };

      const handleMatchSelect = (type, id) => {
        if (type === 'q') {
          if (matchedPairs[id]) return;
          playAudioCue('click', soundEnabled);
          setSelectedMatchQ(id === selectedMatchQ ? null : id);
        } else if (type === 'a' && selectedMatchQ) {
          if (Object.values(matchedPairs).includes(id)) return;

          const qObj = matchQuestions.find(q => q.id === selectedMatchQ);
          if (qObj.matchId === id) {
            setMatchedPairs(prev => ({ ...prev, [selectedMatchQ]: id }));
            setScore(prev => prev + 1);
            setSelectedMatchQ(null);
            playAudioCue('correct', soundEnabled);
          } else {
            setSelectedMatchQ(null);
            playAudioCue('wrong', soundEnabled);
          }
        }
      };

      const triggerCelebration = () => {
        setShowConfetti(true);
        playAudioCue('victory', soundEnabled);
      };

      const placeTaskInQuad = (taskId, targetQuad) => {
        setEisenhowerTasks(prev => prev.map(t => {
          if (t.id === taskId) {
            const isRight = t.correctQuad === targetQuad;
            if (isRight && t.quad !== targetQuad) playAudioCue('correct', soundEnabled);
            return { ...t, quad: targetQuad };
          }
          return t;
        }));
      };

      const renderSlideContent = () => {
        switch (currentSlide) {
          case 0:
            return (
              <div className="text-center relative py-4 md:py-8 flex flex-col items-center w-full max-w-5xl mx-auto">
                <div className="flex gap-4 md:gap-6 mb-6">
                  <span className="p-4 md:p-6 bg-indigo-100 text-indigo-600 rounded-3xl animate-bounce shadow-lg">
                    <i className="fa-solid fa-compass text-4xl md:text-5xl"></i>
                  </span>
                  <span className="p-4 md:p-6 bg-emerald-100 text-emerald-600 rounded-3xl animate-pulse shadow-lg">
                    <i className="fa-solid fa-clock text-4xl md:text-5xl"></i>
                  </span>
                  <span className="p-4 md:p-6 bg-amber-100 text-amber-600 rounded-3xl animate-bounce shadow-lg" style={{ animationDelay: '0.15s' }}>
                    <i className="fa-solid fa-chart-line text-4xl md:text-5xl"></i>
                  </span>
                </div>
                
                <h1 className="text-4xl md:text-6xl lg:text-7xl font-black text-slate-800 mb-6 tracking-tight leading-tight">
                  Планування — <br/>
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 inline-block mt-2">
                    Фундамент успіху в бізнесі
                  </span>
                </h1>
                
                <div className="bg-indigo-600 text-white text-lg md:text-2xl font-black py-3 px-8 md:px-10 rounded-full mb-8 shadow-xl border-4 border-white transform rotate-1">
                  Інтерактивний модуль • §3 «Підприємництво і фінансова грамотність» (9 клас)
                </div>
                
                <div className="max-w-3xl w-full bg-white/90 backdrop-blur-md rounded-3xl p-6 md:p-10 shadow-2xl border border-slate-200 text-left space-y-6">
                  <p className="text-lg md:text-2xl text-slate-700 leading-relaxed font-semibold">
                    Вітаємо! У цьому інтерактивному сервісі ви опануєте навички тайм-менеджменту: навчитеся перетворювати хаотичні ідеї на чіткі бізнес-плани, застосовувати Матрицю Ейзенхауера, Принцип Парето 80/20, метод Pomodoro та керувати власними часовими ресурсами!
                  </p>
                  
                  <div className="pt-6 border-t-2 border-slate-100">
                    <label className="block text-base md:text-xl font-extrabold text-slate-800 mb-3">
                      <i className="fa-solid fa-user-pen text-indigo-600 mr-2"></i>
                      Введіть ім'я та прізвище для персоналізованого сертифіката:
                    </label>
                    <input 
                      type="text" 
                      value={userName}
                      onChange={(e) => setUserName(e.target.value)}
                      placeholder="Наприклад: Марія Коваленко"
                      className="w-full px-5 py-4 rounded-2xl border-2 border-slate-300 focus:border-indigo-500 focus:outline-none text-slate-800 font-bold text-lg md:text-2xl shadow-inner"
                    />
                  </div>
                </div>
              </div>
            );

          case 1:
            return (
              <div className="w-full max-w-5xl mx-auto">
                <TitleBadge 
                  text="Кейс-челендж: Від хаосу до конструктора" 
                  color="bg-indigo-600" 
                  textColor="text-white" 
                  subtitle="Чому наявність одного й того самого ресурсу дає кардинально різний результат?"
                />
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                  {/* Scenario LEGO Chaos vs Plan */}
                  <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl border-4 border-rose-200 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center gap-3 mb-4 text-rose-600 font-black text-2xl md:text-3xl">
                        <i className="fa-solid fa-cubes-stacked text-3xl md:text-4xl"></i>
                        Сценарій А: Хаос деталей
                      </div>
                      <p className="text-slate-700 text-base md:text-xl leading-relaxed mb-6 font-medium">
                        Уявіть тисячу деталей LEGO, висипаних на стіл без інструкції. Дедлайн наближається, час спливає, ви хапаєте випадкові елементи, з'єднуєте їх навмання. 
                      </p>
                      <div className="bg-rose-50 p-4 md:p-5 rounded-2xl border-2 border-rose-200 text-sm md:text-lg text-rose-950 font-bold">
                        ❌ Результат: Брак часу, розчарування, руйнування конструкції та виснаження.
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl border-4 border-emerald-200 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center gap-3 mb-4 text-emerald-600 font-black text-2xl md:text-3xl">
                        <i className="fa-solid fa-sitemap text-3xl md:text-4xl"></i>
                        Сценарій Б: Чіткий алгоритм
                      </div>
                      <p className="text-slate-700 text-base md:text-xl leading-relaxed mb-6 font-medium">
                        Ті самі тисяча деталей, але з покроковим планом та згрупованими блоками. Кожен крок прорахований, роль кожної деталі зрозуміла.
                      </p>
                      <div className="bg-emerald-50 p-4 md:p-5 rounded-2xl border-2 border-emerald-200 text-sm md:text-lg text-emerald-950 font-bold">
                        ✅ Результат: Створений деталізований проєкт точно у визначений термін!
                      </div>
                    </div>
                  </div>
                </div>

                {/* Reflection Challenge */}
                <div className="mt-6 md:mt-8 bg-amber-50 rounded-3xl p-6 border-4 border-amber-300 text-slate-800">
                  <h4 className="font-black text-lg md:text-2xl mb-2 flex items-center gap-3 text-amber-950">
                    <i className="fa-solid fa-lightbulb text-amber-600 text-2xl"></i>
                    Питання до роздумів та дискусії:
                  </h4>
                  <p className="text-base md:text-xl text-slate-800 leading-relaxed font-semibold">
                    Чи бували у вас ситуації у школі або власних проєктах, коли ресурси й енергія були, але через відсутність плану результат перетворився на хаос? Що саме стало «вузьким місцем»?
                  </p>
                </div>
              </div>
            );

          case 2:
            return (
              <div className="w-full max-w-5xl mx-auto">
                <TitleBadge 
                  text="Час — найдефіцитніший ресурс" 
                  color="bg-purple-600" 
                  textColor="text-white"
                  subtitle="Мудрість Пітера Друкера про управління бізнесом та власною долею"
                />

                <div className="bg-white rounded-3xl p-6 md:p-10 shadow-2xl border-4 border-purple-200 mb-6">
                  <div className="flex flex-col md:flex-row items-center gap-6 md:gap-8 mb-8">
                    <div className="w-28 h-28 md:w-32 md:h-32 rounded-full bg-purple-600 text-white flex items-center justify-center font-black text-4xl md:text-5xl shadow-xl shrink-0">
                      PD
                    </div>
                    <div>
                      <blockquote className="italic text-slate-800 text-xl md:text-3xl font-black bg-purple-50 p-6 rounded-3xl border-l-8 border-purple-600 leading-snug">
                        «Час — це найбільш дефіцитний ресурс, і якщо ним не керувати, то все інше також залишиться некерованим».
                      </blockquote>
                      <p className="text-sm md:text-lg text-purple-800 font-extrabold mt-3">
                        — Пітер Фердинанд Друкер, видатний теоретик менеджменту
                      </p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6 border-t-2 border-slate-100">
                    <div className="p-5 bg-slate-50 rounded-2xl border-2 border-slate-200">
                      <h4 className="font-black text-slate-900 text-lg md:text-xl mb-2">💡 Лідерство vs Управління</h4>
                      <p className="text-base md:text-lg text-slate-700 leading-relaxed font-medium">
                        Управління — це вміння робити речі правильно. Лідерство — це вміння робити <strong>правильні речі</strong>.
                      </p>
                    </div>

                    {/* Questions */}
                    <div className="space-y-4">
                      <h4 className="text-center font-black text-sm md:text-base text-indigo-600 uppercase tracking-wider mb-2">
                        Опис / Визначення
                      </h4>
                      {matchQuestions.map((q) => {
                        const isMatched = matchedPairs[q.id] !== undefined;
                        const isSelected = selectedMatchQ === q.id;

                        return (
                          <button
                            key={q.id}
                            disabled={isMatched}
                            onClick={() => handleMatchSelect('q', q.id)}
                            className={`w-full text-left p-4 md:p-5 rounded-2xl border-2 font-bold text-sm md:text-lg transition-all relative cursor-pointer ${
                              isMatched 
                                ? 'bg-emerald-50 border-emerald-400 text-emerald-900 opacity-80' 
                                : isSelected 
                                  ? 'bg-indigo-100 border-indigo-500 text-indigo-950 shadow-md scale-[1.02]' 
                                  : 'bg-slate-50 border-slate-200 text-slate-800 hover:border-indigo-300'
                            }`}
                          >
                            {q.text}
                            {isMatched && <i className="fa-solid fa-circle-check text-emerald-500 absolute right-4 top-1/2 transform -translate-y-1/2 text-xl"></i>}
                          </button>
                        );
                      })}
                    </div>

                    {/* Answers */}
                    <div className="space-y-4">
                      <h4 className="text-center font-black text-sm md:text-base text-indigo-600 uppercase tracking-wider mb-2">
                        Термін / Поняття
                      </h4>
                      {matchAnswers.map((a) => {
                        const isMatched = Object.values(matchedPairs).includes(a.id);
                        const isSelectable = selectedMatchQ !== null && !isMatched;

                        return (
                          <button
                            key={a.id}
                            disabled={!isSelectable && !isMatched}
                            onClick={() => handleMatchSelect('a', a.id)}
                            className={`w-full text-center p-4 md:p-5 rounded-2xl border-2 font-black text-sm md:text-lg transition-all ${
                              isMatched 
                                ? 'bg-emerald-50 border-emerald-400 text-emerald-900 opacity-80 cursor-default' 
                                : isSelectable 
                                  ? 'bg-amber-100 border-amber-400 text-amber-950 hover:bg-amber-200 cursor-pointer animate-pulse' 
                                  : 'bg-slate-50 border-slate-200 text-slate-400 cursor-not-allowed'
                            }`}
                          >
                            {a.text}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {Object.keys(matchedPairs).length === matchQuestions.length && (
                    <div className="mt-6 bg-emerald-500 text-white text-center p-5 rounded-2xl font-black text-xl md:text-2xl animate-bounce shadow-lg">
                      🎉 Чудово! Усі поняття успішно з'єднано! (+4 бали)
                    </div>
                  )}
                </div>
              </div>
            );

          case 11:
            return (
              <div className="w-full max-w-5xl mx-auto py-2">
                {showConfetti && <ConfettiEffect />}

                <div id="certificate-print-area" className="bg-white rounded-3xl p-6 md:p-12 shadow-2xl border-8 border-indigo-600 relative overflow-hidden text-center max-h-[75vh] overflow-y-auto">
                  
                  <i className="fa-solid fa-award text-indigo-100 text-[22rem] absolute -right-16 -bottom-16 opacity-30 pointer-events-none"></i>

                  <div className="flex justify-center items-center mb-4">
                    <div className="flex items-center gap-2 text-indigo-700 font-black text-sm md:text-lg uppercase tracking-widest">
                      <i className="fa-solid fa-graduation-cap text-2xl"></i> Офіційний навчальний сертифікат • 9 Клас
                    </div>
                  </div>

                  <h2 className="text-4xl md:text-6xl font-black text-slate-900 tracking-wider uppercase mb-2">
                    Сертифікат Успіху
                  </h2>
                  <p className="text-indigo-700 font-extrabold text-base md:text-xl uppercase tracking-widest mb-6">
                    З курсу «Планування — фундамент успіху в бізнесі»
                  </p>

                  <div className="my-6 py-6 border-y-4 border-indigo-200 bg-indigo-50/50 rounded-3xl">
                    <p className="text-slate-600 text-base md:text-lg font-bold mb-2">Цим засвідчується, що учень / учениця</p>
                    <h3 className="text-3xl md:text-5xl font-black text-slate-900 underline decoration-indigo-500 decoration-4 underline-offset-8">
                      {userName.trim() ? userName : "Учень / Учениця 9 класу"}
                    </h3>
                    <p className="text-slate-700 text-base md:text-xl mt-4 font-semibold leading-relaxed">
                      успішно пройшов(ла) практичний курс з планування, опанував(ла) інструменти тайм-менеджменту та готов(а) будувати власні бізнес-проєкти.
                    </p>
                  </div>

                  {/* Score Display */}
                  <div className="flex flex-col md:flex-row items-center justify-center gap-6 my-6">
                    <div className="bg-slate-900 text-white p-5 rounded-2xl flex items-center gap-4 shadow-xl">
                      <i className="fa-solid fa-trophy text-amber-400 text-4xl"></i>
                      <div className="text-left">
                        <div className="text-xs md:text-sm text-slate-400 font-bold">Результат випробувань</div>
                        <div className="text-3xl font-black text-amber-300">{score} з {maxScore} балів</div>
                      </div>
                    </div>

                    <div className="flex gap-2 text-3xl md:text-4xl">
                      {[...Array(5)].map((_, i) => (
                        <i 
                          key={i} 
                          className={`fa-solid fa-star ${i < Math.round((score / maxScore) * 5) ? 'text-amber-400' : 'text-slate-200'}`}
                        ></i>
                      ))}
                    </div>
                  </div>

                  {/* Recommendations */}
                  <div className="bg-indigo-50 border-2 border-indigo-200 rounded-3xl p-6 my-6 text-left space-y-3">
                    <h4 className="font-black text-indigo-950 text-lg md:text-2xl flex items-center gap-3">
                      <i className="fa-solid fa-face-smile text-indigo-600 text-3xl"></i>
                      Підсумок та рекомендації:
                    </h4>
                    <p className="text-slate-800 text-base md:text-xl leading-relaxed font-semibold">
                      {score >= 10 
                        ? "🎉 Блискучий результат! Ви майстерно орієнтуєтеся в Матриці Ейзенхауера, принципі 80/20 та володієте техніками запобігання прокрастинації!"
                        : score >= 6
                          ? "👍 Добра робота! Основні поняття тайм-менеджменту засвоєно. Спробуйте впровадити метод Pomodoro та тайм-трекер у повсякденне життя для ще більших досягнень."
                          : "📚 Дякуємо за проходження! Перегляньте матеріали з планування ще раз та випробуйте власні сили в повторному тестуванні."
                      }
                    </p>
                  </div>

                  {/* Print & Fireworks Actions */}
                  <div className="flex flex-wrap justify-center gap-4 mt-6 no-print">
                    <button 
                      onClick={triggerCelebration}
                      className="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-black text-base md:text-lg px-8 py-4 rounded-full shadow-lg flex items-center gap-3 transition-transform active:scale-95 cursor-pointer"
                    >
                      <i className="fa-solid fa-wand-magic-sparkles text-2xl"></i> Святковий салют!
                    </button>

                    <button 
                      onClick={() => window.print()}
                      className="bg-slate-800 hover:bg-slate-900 text-white font-black text-base md:text-lg px-8 py-4 rounded-full shadow-lg flex items-center gap-3 transition-transform active:scale-95 cursor-pointer"
                    >
                      <i className="fa-solid fa-print text-2xl"></i> Друк сертифіката
                    </button>
                  </div>

                </div>
              </div>
            );

          default:
            return null;
        }
      };

      return (
        <div className="min-h-screen w-full bg-gradient-to-br from-slate-100 via-slate-50 to-indigo-50 text-slate-800 flex flex-col justify-between overflow-x-hidden">
          
          {/* Header */}
          <header className="w-full bg-white/80 backdrop-blur-md border-b border-slate-200 px-4 md:px-8 py-4 flex justify-between items-center sticky top-0 z-40 shadow-sm no-print">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center font-black text-2xl shadow-md">
                П
              </div>
              <div>
                <h1 className="font-black text-base md:text-xl text-slate-800 leading-tight">
                  Планування — фундамент успіху
                </h1>
                <p className="text-xs md:text-sm text-slate-500 font-bold">Інтерактивний урок • 9 клас</p>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <button 
                onClick={() => setSoundEnabled(!soundEnabled)}
                className={`w-12 h-12 rounded-2xl border-2 flex items-center justify-center transition-all cursor-pointer text-lg ${
                  soundEnabled ? 'bg-indigo-100 border-indigo-300 text-indigo-800' : 'bg-slate-100 border-slate-300 text-slate-400'
                }`}
                title={soundEnabled ? "Вимкнути звук" : "Увімкнути звук"}
              >
                <i className={`fa-solid ${soundEnabled ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
              </button>

              <div className="bg-indigo-400/20 border-2 border-indigo-500 px-4 py-2 rounded-2xl flex items-center gap-2 font-black text-base md:text-lg text-slate-800 shadow-sm">
                <i className="fa-solid fa-star text-amber-500"></i>
                <span>{score}/{maxScore}</span>
              </div>
            </div>
          </header>

          {/* Main Slide Body */}
          <main className="flex-1 flex items-center justify-center p-4 md:p-8">
            {renderSlideContent()}
          </main>

          {/* Navigation Bar */}
          <footer className="w-full bg-white/90 backdrop-blur border-t border-slate-200 px-4 md:px-8 py-4 flex items-center justify-between z-40 shadow-sm no-print">
            <button 
              onClick={prevSlide}
              disabled={currentSlide === 0}
              className={`flex items-center gap-2 px-6 py-3 rounded-full font-black text-base transition-all cursor-pointer ${
                currentSlide === 0 
                  ? 'text-slate-300 cursor-not-allowed' 
                  : 'text-slate-700 bg-slate-100 hover:bg-indigo-600 hover:text-white shadow-sm'
              }`}
            >
              <i className="fa-solid fa-chevron-left"></i> Назад
            </button>

            {/* Slide Pagination Dots */}
            <div className="flex items-center gap-2">
              {[...Array(totalSlides + 1)].map((_, i) => (
                <button
                  key={i}
                  onClick={() => {
                    playAudioCue('click', soundEnabled);
                    setCurrentSlide(i);
                  }}
                  className={`h-3 rounded-full transition-all cursor-pointer ${
                    currentSlide === i 
                      ? 'w-10 bg-indigo-600' 
                      : 'w-3 bg-slate-300 hover:bg-slate-400'
                  }`}
                  title={`Слайд ${i + 1}`}
                />
              ))}
            </div>

            <button 
              onClick={nextSlide}
              disabled={currentSlide === totalSlides}
              className={`flex items-center gap-2 px-6 py-3 rounded-full font-black text-base transition-all cursor-pointer ${
                currentSlide === totalSlides 
                  ? 'text-slate-300 cursor-not-allowed' 
                  : 'text-white bg-indigo-600 hover:bg-indigo-700 shadow-md'
              }`}
            >
              Далі <i className="fa-solid fa-chevron-right"></i>
            </button>
          </footer>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
